# A generic, single database configuration.

[alembic]
script_location = %(here)s/alembic

# Prepended to sys.path so `app` is importable from env.py.
prepend_sys_path = .

path_separator = os

# database URL is supplied at runtime by env.py via get_database_url().


[post_write_hooks]


# Logging configuration, consumed by env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
