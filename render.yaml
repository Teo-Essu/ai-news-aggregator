services:
  - type: cron
    name: daily-digest-job
    env: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 5 * * *"
    # Apply pending migrations before running the pipeline.
    dockerCommand: sh -c "alembic upgrade head && python main.py"
    envVars:
      # Supabase session-pooler connection string; set in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: TO_EMAIL
        sync: false
      - key: APP_PASSWORD
        sync: false